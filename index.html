<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santhi super Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"  href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com"/css2?family=poppins:wght@300;400;500;600;700&display=swap" rel="style sheet">
</head>
<body>
    <header>
    <div class ="logo-box">
    <img src="images/logo.png" class="logo-img">
    <h2>Santhi Super Market</h2>
    </div>
    <nav>
    <a href="#">Home</a>
    <a href="#">products</a>
    <a href="#">offers</a>
    <a href="#">contact</a>
    </nav>
    </header>
    <section class="hero">
    <div class="hero-text">
    <h1>Fresh Groceries & Fruits</h1>
    <p>Healthy foods and fresh grocery products everyday.</p>
    <button>Shop Now</button>
    </div>
    <div class="hero-image">
    <img src="images/banner.png">
    </div>
    </section>
    <h2 class="section-title">our products</h2>
    <section class="products">
    <div class="card">
    <img src="images/Fresh-juice.jpg">
    <h3>Fresh Juice</h3>
    </div>
    <div class="card">
    <img src="images/Fresh-fruits.jpg">
    <h3>Fresh fruits</h3>  
    </div>
    </section>
    <section class="offer">
    <div class="offer-left">
     <img src="images/offer-products.jpg">
     </div>
     <div class="offer-right">
    <h2>Special Offer</h2>
    <p>Fresh Products with best quality.</p>
    <img src="images/buy1-get1.jpg">
     <div class="offer-text">
     <h2>Limited time deal</h2>
     <h1>BUY 1 GET 1</h1>
     </div>
     </div>
    </section>
    <footer>
    <p>© 2026 Santhi Super Market</p>
    </footer>
    
</body>
</html>
